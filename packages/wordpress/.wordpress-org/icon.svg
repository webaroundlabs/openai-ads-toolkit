<svg width="256" height="256" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg" aria-label="Conversion tracking mark">
  <defs>
    <radialGradient id="ground" cx="0.58" cy="0.5" r="0.72">
      <stop offset="0" stop-color="#1b2c30"></stop>
      <stop offset="0.55" stop-color="#111d20"></stop>
      <stop offset="1" stop-color="#0a1113"></stop>
    </radialGradient>

    <linearGradient id="client" x1="34" y1="48" x2="150" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3bf0d8"></stop>
      <stop offset="1" stop-color="#12a8ff"></stop>
    </linearGradient>

    <linearGradient id="server" x1="34" y1="208" x2="150" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffc94a"></stop>
      <stop offset="1" stop-color="#ff7a45"></stop>
    </linearGradient>

    <linearGradient id="merged" x1="150" y1="128" x2="226" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"></stop>
      <stop offset="1" stop-color="#b7e6ff"></stop>
    </linearGradient>

    <radialGradient id="core" cx="0.42" cy="0.36" r="0.85">
      <stop offset="0" stop-color="#ffffff"></stop>
      <stop offset="0.7" stop-color="#f4fbff"></stop>
      <stop offset="1" stop-color="#d3ecfa"></stop>
    </radialGradient>

    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7" result="b"></feGaussianBlur>
      <feMerge><feMergeNode in="b"></feMergeNode><feMergeNode in="b"></feMergeNode></feMerge>
    </filter>

    <filter id="bloom" x="-90%" y="-90%" width="280%" height="280%">
      <feGaussianBlur stdDeviation="11"></feGaussianBlur>
    </filter>
  </defs>

  <rect width="256" height="256" fill="url(#ground)"></rect>

  <!-- The glow layer sits under the strokes, so the colour bleeds into the
       ground the way light does rather than outlining the shape. -->
  <g filter="url(#glow)" opacity="0.55" stroke-linecap="round" fill="none">
    <path d="M34 48 C 80 48, 114 86, 150 128" stroke="url(#client)" stroke-width="15"></path>
    <path d="M34 208 C 80 208, 114 170, 150 128" stroke="url(#server)" stroke-width="15"></path>
    <path d="M150 128 L 226 128" stroke="url(#merged)" stroke-width="17"></path>
  </g>

  <g stroke-linecap="round" fill="none">
    <path id="pClient" d="M34 48 C 80 48, 114 86, 150 128" stroke="url(#client)" stroke-width="17"></path>
    <path id="pServer" d="M34 208 C 80 208, 114 170, 150 128" stroke="url(#server)" stroke-width="17"></path>
    <path id="pOut" d="M150 128 L 226 128" stroke="url(#merged)" stroke-width="21"></path>
  </g>

  <!-- Travelling pulses: one dash per path, moved by stroke-dashoffset. -->
  <g stroke-linecap="round" fill="none" filter="url(#glow)">
    
    
    
  </g>

  <circle cx="34" cy="48" r="11.5" fill="#4ff0e0"></circle>
  <circle cx="34" cy="208" r="11.5" fill="#ffc247"></circle>

  
  <circle id="halo" cx="150" cy="128" r="23" fill="#ffffff" opacity="0.22" filter="url(#bloom)"></circle>
  <circle id="disc" cx="150" cy="128" r="23" fill="url(#core)"></circle>
</svg>
