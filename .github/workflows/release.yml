# Publishing is not automatic, and that is the point.
#
# Four registries with four different failure modes sit behind this file:
# Packagist and npm cannot unpublish a version, the WordPress plugin directory
# serves whatever is in SVN trunk to every site on its next update check, and a
# GTM template is reviewed by hand. A pushed tag is a decision, so a tag is what
# starts this - never a merge to main.
#
# Packagist has no job here because it does not need one: it watches the
# repository and picks up the tag itself. The WordPress directory has no job
# either, until the plugin is actually approved there - see docs/releasing.md.
#
# Every path re-runs the full checks first. CI having been green on the commit
# is not the same as it being green on the artefact, and the artefact is what
# people install.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build and verify the artefacts without publishing anything'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify the tagged commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: json, mbstring
          coverage: none
          tools: composer:v2

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: packages/js/package-lock.json

      - name: Specification
        run: python packages/spec/verify.py

      - name: PHP core
        working-directory: packages/php
        run: composer install --prefer-dist --no-interaction --no-progress && composer check

      - name: JavaScript
        working-directory: packages/js
        run: npm ci && npm run check && npm run build

      - name: Laravel adapter
        working-directory: packages/laravel
        run: composer install --prefer-dist --no-interaction --no-progress && composer check

      - name: WordPress plugin
        working-directory: packages/wordpress
        run: composer install --prefer-dist --no-interaction --no-progress && composer check

      # The artefact browsers receive, not the source it came from.
      - name: No credential can reach a browser
        run: python scripts/check-secrets.py

      # A tag that disagrees with the manifests would publish a version nobody
      # can find again. Cheaper to catch here than to yank afterwards.
      - name: The tag matches every manifest
        if: startsWith(github.ref, 'refs/tags/v')
        run: python scripts/check-version.py "${GITHUB_REF_NAME#v}"

  npm:
    name: Publish @webaround/openai-ads
    needs: verify
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') && !inputs.dry_run
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      # No registry-url on purpose. It makes setup-node write an .npmrc holding
      # `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}` and point
      # NPM_CONFIG_USERCONFIG at it. With no NODE_AUTH_TOKEN in the environment
      # that line still reads as a credential, so npm believes it is
      # authenticated, never falls back to Trusted Publishing, and the registry
      # answers a bare 404 on PUT - the status it uses for writes it will not
      # explain. registry.npmjs.org is the default registry anyway.
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: packages/js/package-lock.json

      - name: Build
        working-directory: packages/js
        run: npm ci && npm run build

      # Trusted Publishing exchanges this job's OIDC token for a short-lived
      # npm credential, so no long-lived NPM_TOKEN lives in repository secrets.
      # It needs a newer npm than the one bundled with Node 22.
      - name: Use an npm that can do Trusted Publishing
        run: |
          npm install -g npm@latest
          # Trusted Publishing needs npm >= 11.5.1 and the two ACTIONS_ID_TOKEN_*
          # variables GitHub injects only under `id-token: write`. When a publish
          # fails with ENEEDAUTH, the question is always which of those is
          # missing - so say so here rather than guessing from the failure.
          echo "npm $(npm --version), node $(node --version)"
          echo "OIDC request url set: ${ACTIONS_ID_TOKEN_REQUEST_URL:+yes}${ACTIONS_ID_TOKEN_REQUEST_URL:-NO}"
          echo "OIDC request token set: ${ACTIONS_ID_TOKEN_REQUEST_TOKEN:+yes}${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-NO}"

      # --provenance signs the package with this workflow run, so anyone can
      # verify the published tarball came from this commit.
      - name: Publish
        working-directory: packages/js
        run: npm publish --provenance --access public

  plugin-zip:
    name: Build the WordPress plugin
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: json, mbstring
          coverage: none
          tools: composer:v2

      # --no-dev because the plugin ships its vendor directory, and a site does
      # not need PHPUnit. The core arrives through the path repository, so this
      # is also what proves the plugin installs without the monorepo's dev deps.
      - name: Install runtime dependencies only
        working-directory: packages/wordpress
        run: composer install --no-dev --prefer-dist --no-interaction --no-progress --optimize-autoloader

      - name: Assemble
        run: bash scripts/build-plugin.sh

      # The zip is named after the plugin slug, which is not the repository's
      # name. Without if-no-files-found: error, a path that matches nothing is a
      # warning: the job goes green, uploads an empty artifact, and the failure
      # surfaces two jobs later as "Artifact not found" - which is what happened
      # when the slug was renamed and this path was not.
      - uses: actions/upload-artifact@v7
        with:
          name: openai-ads-wordpress-plugin
          path: build/conversion-tracking-for-openai-ads.zip
          if-no-files-found: error
          retention-days: 14

  github-release:
    name: Draft the GitHub release
    needs: [verify, plugin-zip]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') && !inputs.dry_run
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: openai-ads-wordpress-plugin
          path: build

      # A draft, not a publish. Somebody reads the notes before the world does.
      - name: Draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --draft \
            --title "$GITHUB_REF_NAME" \
            --notes "See CHANGELOG.md for what changed in this release." \
            build/conversion-tracking-for-openai-ads.zip
