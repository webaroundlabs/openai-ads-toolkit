name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  spec:
    name: Specification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # Checks that every cross-reference in the spec resolves, that the
      # documented OpenAI Ads facts still hold, that the golden fixtures agree
      # with the files they derive from, and that both GTM templates offer
      # exactly the events the catalogue says they can.
      - name: Verify the shared specification
        run: python packages/spec/verify.py

  php:
    name: PHP core (${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: json, mbstring
          coverage: none
          tools: composer:v2

      - name: Install
        working-directory: packages/php
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Style
        working-directory: packages/php
        run: vendor/bin/php-cs-fixer fix --dry-run --diff

      # Level 9 over src. This package is the published contract, so a type
      # error here reaches every adapter and every site running one.
      - name: Static analysis
        working-directory: packages/php
        run: |
          vendor/bin/phpstan analyse --no-progress -c phpstan.neon.dist
          vendor/bin/phpstan analyse --no-progress -c phpstan.tests.neon.dist

      - name: Test
        working-directory: packages/php
        run: vendor/bin/phpunit

  javascript:
    name: JavaScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: packages/js/package-lock.json

      - name: Install
        working-directory: packages/js
        run: npm ci

      - name: Lint
        working-directory: packages/js
        run: npm run lint

      - name: Typecheck
        working-directory: packages/js
        run: npm run typecheck

      - name: Test
        working-directory: packages/js
        run: npm test

      # Building here is not busywork: the secrets job scans the built bundle,
      # which is the artefact browsers actually receive.
      - name: Build
        working-directory: packages/js
        run: npm run build

      - uses: actions/upload-artifact@v7
        with:
          name: js-dist
          path: packages/js/dist
          retention-days: 1

  laravel:
    name: Laravel adapter (PHP ${{ matrix.php }}, Laravel ${{ matrix.laravel }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3']
        # Laravel 12 only. The adapter still declares ^11.0|^12.0 and works
        # there, but every laravel/framework 11.x now carries an unfixed
        # Packagist advisory, so Composer refuses to install one and the leg
        # cannot be made green. Testing against a version nobody can install
        # proves nothing; disabling the advisory check to get a tick would
        # prove less.
        laravel: ['12.*']
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: json, mbstring
          coverage: none
          tools: composer:v2

      # The adapter reaches the core through a path repository, so a full
      # checkout is all the wiring it needs.
      - name: Install
        working-directory: packages/laravel
        run: |
          composer require "illuminate/support:${{ matrix.laravel }}" "illuminate/contracts:${{ matrix.laravel }}" \
            --no-interaction --no-update
          composer update --prefer-dist --no-interaction --no-progress

      - name: Style
        working-directory: packages/laravel
        run: vendor/bin/php-cs-fixer fix --dry-run --diff

      - name: Static analysis
        working-directory: packages/laravel
        run: |
          vendor/bin/phpstan analyse --no-progress -c phpstan.neon.dist
          vendor/bin/phpstan analyse --no-progress -c phpstan.tests.neon.dist

      - name: Test
        working-directory: packages/laravel
        run: vendor/bin/phpunit

  wordpress:
    name: WordPress plugin (${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3']
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: json, mbstring
          coverage: none
          tools: composer:v2

      - name: Install
        working-directory: packages/wordpress
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Style
        working-directory: packages/wordpress
        run: vendor/bin/php-cs-fixer fix --dry-run --diff

      # WordPress core and WooCommerce arrive as stubs, so this analyses the
      # integration rather than reporting that WordPress exists.
      - name: Static analysis
        working-directory: packages/wordpress
        run: |
          vendor/bin/phpstan analyse --no-progress --memory-limit=1G -c phpstan.neon.dist
          vendor/bin/phpstan analyse --no-progress --memory-limit=1G -c phpstan.tests.neon.dist

      - name: Test
        working-directory: packages/wordpress
        run: vendor/bin/phpunit

  lint:
    name: PHP syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      # Catches a parse error in the example code and the WordPress plugin
      # entry points, neither of which any test suite loads.
      - name: Lint every PHP file
        run: |
          status=0
          while IFS= read -r file; do
            php -l "$file" > /dev/null || { echo "Syntax error: $file"; status=1; }
          done < <(git ls-files '*.php')
          exit $status

  secrets:
    name: Credential exposure
    runs-on: ubuntu-latest
    needs: javascript
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # The built bundle is what browsers receive, so it is scanned rather than
      # only the sources it came from.
      - uses: actions/download-artifact@v8
        with:
          name: js-dist
          path: packages/js/dist

      - name: Check no credential can reach a browser
        run: python scripts/check-secrets.py
