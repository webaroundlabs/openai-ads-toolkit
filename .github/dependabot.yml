version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly

  - package-ecosystem: npm
    directory: /packages/js
    schedule:
      interval: monthly
    # Dev-only: the published package has no runtime dependencies, and keeping
    # it that way is deliberate.
    versioning-strategy: increase-if-necessary

  - package-ecosystem: composer
    directory: /packages/php
    schedule:
      interval: monthly

  # The adapters reach the core through a Composer path repository, so only
  # their own dev tooling and host framework constraints are updated here.
  - package-ecosystem: composer
    directory: /packages/laravel
    schedule:
      interval: monthly

  - package-ecosystem: composer
    directory: /packages/wordpress
    schedule:
      interval: monthly
